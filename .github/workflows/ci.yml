name: CI

on:
  pull_request:
  push:
    branches: [dev]

# Cancel superseded runs for the same PR / branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for Stellar secret key literals
        run: |
          if git grep -El 'S[A-Z2-7]{55}' -- ':!*.test.ts' ':!*.test.tsx' ':!*.spec.*' 2>/dev/null; then
            echo "::error::Stellar secret key literal found in tracked files"
            exit 1
          fi
          echo "No secret key literals detected."

  verify:
    name: Lint · Typecheck · Build · Test
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Turbo cache keeps lint/build/typecheck incremental across runs.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
