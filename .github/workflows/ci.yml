name: CI

on:
  pull_request:
  push:
    branches: [dev]

# Cancel superseded runs for the same PR / branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Turbo cache keeps lint/build/typecheck incremental across runs.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: npm run lint

      - name: No hardcoded contract IDs
        run: |
          matches=$(grep -rnoE '"C[A-Z2-7]{55}"' apps/web-app/src \
            | grep -v 'contractsByNetwork.ts' \
            | grep -v 'assets.config.ts' \
            | grep -v 'contractsByNetwork.test.ts' \
            | grep -v 'generated/' || true)
          if [ -n "$matches" ]; then
            echo "::error::Hardcoded contract ID outside registry"
            echo "$matches"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
